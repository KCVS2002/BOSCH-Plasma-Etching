# Leave-One-Lot-Out robustness check for the current best multimodal DL setup.
# Each fold holds out one full lot for validation and trains on the remaining lots.
# This is stricter than wafer-level K-fold and should be interpreted as an
# unseen-lot generalization check, not the primary in-distribution CV score.

experiment:
  title: "dl multimodal loo-lot oxide"
  seed: 42
  limit_folds: null   # run all 10 held-out lots; override with --limit-folds for smoke tests

data:
  cache_version: "v1"
  split_file: "splits/loo_lot.npz"
  spatial_features: ["X", "Y"]
  targets: ["oxide_etch"]   # primary research target; add si_etch later if needed
  modality: "multimodal"
  t_o: 128
  t_p: 30

model:
  name: "cycle_aware_bilstm"
  params:
    oes_encoder:
      in_time: 128
      in_channels: 3648
      out_dim: 128
      base_channels: 16
      n_blocks: 4
      kernel_time: 3
      kernel_chan: 9
      stride_time: 2
      stride_chan: 4
      dropout: 0.1
    proc_encoder:
      in_time: 30
      in_channels: 31
      out_dim: 64
      base_channels: 16
      n_blocks: 3
      kernel_time: 3
      kernel_chan: 3
      stride_time: 2
      stride_chan: 2
      dropout: 0.1
    cycle_fusion_dim: 128
    lstm_hidden: 128
    lstm_layers: 1
    lstm_dropout: 0.0
    head_hidden: 128
    head_dropout: 0.2
    use_xy: true
    xy_n_freqs: 6
    xy_enc_dim: 64
    use_film: true
    pool: "mean"

training:
  epochs: 40
  batch_size: 4
  lr: 1.5e-3
  weight_decay: 1.0e-4
  scheduler: "cosine"
  early_stop_patience: 8
  loss: "mse"
  num_workers: 0
  amp: false
