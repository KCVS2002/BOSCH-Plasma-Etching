# Aux + Mixup + EMA + 120-epoch longrun without early stopping.
#
# Motivation:
#   aux+mixup (2026-05-28_03-16) gave fold 4 0.40→0.56 (+0.16), agg 0.621→0.644,
#   agg std 0.138→0.087 (-37%). But:
#   - fold 4 best_epoch=70 in 80-epoch run — model still converging at limit
#   - learning curve oscillates upward (mixup noise + bimodal landscape)
#   - patience=15 fired in folds 0/2/3 around epoch 60-66
#
# Changes vs aux+mixup baseline:
#   training.epochs:               80  → 120     (give fold 4 enough budget)
#   training.early_stop_patience:  15  → 0       (disable; best_state still tracked)
#   training.ema.enabled:          —   → true    (Polyak weight averaging, decay 0.999)
#
# EMA design:
#   - shadow model = deepcopy(model); after each optim.step():
#       ema_p = d_eff · ema_p + (1 - d_eff) · model_p
#     where d_eff = min(0.999, (1+step)/(10+step)) ramps up early
#   - validation evaluates on shadow weights → smoother val curve, robust best
#   - best_state checkpoint saves shadow weights → final inference uses EMA
#
# Why no early stop:
#   With 120 epochs × 5 fold × ~5 min/epoch ≈ 2.5h total, the compute cost
#   of "wasted" late epochs is minimal. best_state is tracked every epoch
#   regardless. Removing early stop eliminates false-positive stops on the
#   oscillating mixup curves.
#
# Baseline to beat (aux+mixup, 80 epochs, patience 15):
#   fold 0: 0.730  fold 1: 0.685  fold 2: 0.523  fold 3: 0.725  fold 4: 0.556
#   aggregate R² 0.644 ± 0.087, RMSE 0.0458 ± 0.006
# Success criteria:
#   fold 4 R²:        0.556 → 0.62+ (full convergence)
#   agg R²:           0.644 → 0.70+ without losing fold 0/1/3
#   agg std:          0.087 → ≤ 0.07 (paper target: std/mean ≤ 10%)
#   fold 2 unchanged or slightly up; not the primary target this round.

experiment:
  title: "dl multimodal oes aux mixup ema longrun 5fold"
  seed: 43
  limit_folds: 5

data:
  cache_version: "v1"
  split_file: "splits/kfold5_wafer_seed43.npz"
  spatial_features: ["X", "Y"]
  targets: ["oxide_etch"]
  modality: "multimodal"
  t_o: 128
  t_p: 30
  oes_band_selection:
    method: "correlation"
    top_k: 256
    stat: "late_mean"
    late_start_cycle: 80
    early_end_cycle: 20

model:
  name: "cycle_aware_bilstm"
  params:
    oes_encoder:
      in_time: 128
      in_channels: 256
      out_dim: 128
      base_channels: 16
      n_blocks: 4
      kernel_time: 3
      kernel_chan: 9
      stride_time: 2
      stride_chan: 2
      dropout: 0.1
    proc_encoder:
      in_time: 30
      in_channels: 31
      out_dim: 64
      base_channels: 16
      n_blocks: 3
      kernel_time: 3
      kernel_chan: 3
      stride_time: 2
      stride_chan: 2
      dropout: 0.1
    cycle_fusion_dim: 128
    lstm_hidden: 128
    lstm_layers: 1
    lstm_dropout: 0.0
    head_hidden: 128
    head_dropout: 0.2
    use_xy: true
    xy_n_freqs: 6
    xy_enc_dim: 64
    use_film: true
    pool: "mean"
    aux_wafer_mean: true
    aux_wafer_loss_weight: 0.3

training:
  epochs: 120
  batch_size: 4
  lr: 5.0e-4
  weight_decay: 1.0e-4
  scheduler: "cosine"
  early_stop_patience: 0      # 0 disables early stopping; best_state still tracked every epoch
  loss: "mse"
  num_workers: 0
  amp: false
  mixup:
    enabled: true
    alpha: 0.2
    prob: 1.0
  ema:
    enabled: true
    decay: 0.999              # half-life ≈ 700 steps; for 120 ep × ~18 step/ep = 2160 steps total

