# Method 2 + longer run — lower LR, more epochs, higher patience.
#
# Changes from exp_dl_multimodal_oes_corr_topk_5fold.yaml (best so far):
#   lr:                    1.5e-3 → 5e-4   (3x smaller, reduces fold 4 oscillation)
#   epochs:                40     → 80      (fold 0 hit the 40-epoch limit; still converging)
#   early_stop_patience:   8      → 15      (give harder folds more time to recover)
#
# Motivation from epoch logs:
#   fold 0 best_epoch=37/39 — still improving at limit → needs more epochs
#   fold 4 val_r2 swings -0.05 to +0.38 per epoch — lr too high for this fold
#   fold 2 best_epoch=4 then overfits — not an lr/epoch issue; no change expected
#
# Baseline: exp_dl_multimodal_oes_corr_topk_5fold (top_k=256, late_mean):
#   R² 0.592±0.152  RMSE 0.0485±0.0095

experiment:
  title: "dl multimodal oes topk256 longrun 5fold"
  seed: 42
  limit_folds: 5

data:
  cache_version: "v1"
  split_file: "splits/kfold5_wafer.npz"
  spatial_features: ["X", "Y"]
  targets: ["oxide_etch"]
  modality: "multimodal"
  t_o: 128
  t_p: 30
  oes_band_selection:
    method: "correlation"
    top_k: 256
    stat: "late_mean"
    late_start_cycle: 80
    early_end_cycle: 20

model:
  name: "cycle_aware_bilstm"
  params:
    oes_encoder:
      in_time: 128
      in_channels: 256
      out_dim: 128
      base_channels: 16
      n_blocks: 4
      kernel_time: 3
      kernel_chan: 9
      stride_time: 2
      stride_chan: 2
      dropout: 0.1
    proc_encoder:
      in_time: 30
      in_channels: 31
      out_dim: 64
      base_channels: 16
      n_blocks: 3
      kernel_time: 3
      kernel_chan: 3
      stride_time: 2
      stride_chan: 2
      dropout: 0.1
    cycle_fusion_dim: 128
    lstm_hidden: 128
    lstm_layers: 1
    lstm_dropout: 0.0
    head_hidden: 128
    head_dropout: 0.2
    use_xy: true
    xy_n_freqs: 6
    xy_enc_dim: 64
    use_film: true
    pool: "mean"

training:
  epochs: 80
  batch_size: 4
  lr: 5.0e-4
  weight_decay: 1.0e-4
  scheduler: "cosine"
  early_stop_patience: 15
  loss: "mse"
  num_workers: 0
  amp: false
