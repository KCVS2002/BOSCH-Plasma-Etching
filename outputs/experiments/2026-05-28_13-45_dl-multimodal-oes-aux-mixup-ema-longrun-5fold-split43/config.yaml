# Split-robustness check for the current best model
# (aux + mixup + EMA + 120ep no-early-stop).
#
# Why:
#   All ablations so far have shared one StratifiedGroupKFold split
#   (seed=42, kfold5_wafer.npz). Hyperparameters (aux λ, mixup α, OES top_k,
#   EMA decay, 120-ep budget) were tuned watching that single split, so the
#   reported agg R² 0.666 may carry split-overfit. This config swaps to a
#   freshly drawn split (seed=43, kfold5_wafer_seed43.npz) — same lot
#   stratification, different wafer grouping — and reruns the best model
#   end-to-end without touching any hyperparameter.
#
# Expected reading:
#   - agg R² stays near 0.65 → improvements generalize across splits
#   - agg R² drops to ≤ 0.55 → split-overfit suspected
#   - new fold's worst case is much worse than fold 4 was → confirms the
#     "hard fold" rotates by split, not by an intrinsic data flaw
#
# Baseline (same config, seed=42 split):
#   agg R² 0.666 ± 0.110, RMSE 0.0440 ± 0.007
#   fold 0=0.75, f1=0.72, f2=0.49, f3=0.78, f4=0.59

experiment:
  title: "dl multimodal oes aux mixup ema longrun 5fold split43"
  seed: 42
  limit_folds: 5

data:
  cache_version: "v1"
  split_file: "splits/kfold5_wafer_seed43.npz"
  spatial_features: ["X", "Y"]
  targets: ["oxide_etch"]
  modality: "multimodal"
  t_o: 128
  t_p: 30
  oes_band_selection:
    method: "correlation"
    top_k: 256
    stat: "late_mean"
    late_start_cycle: 80
    early_end_cycle: 20

model:
  name: "cycle_aware_bilstm"
  params:
    oes_encoder:
      in_time: 128
      in_channels: 256
      out_dim: 128
      base_channels: 16
      n_blocks: 4
      kernel_time: 3
      kernel_chan: 9
      stride_time: 2
      stride_chan: 2
      dropout: 0.1
    proc_encoder:
      in_time: 30
      in_channels: 31
      out_dim: 64
      base_channels: 16
      n_blocks: 3
      kernel_time: 3
      kernel_chan: 3
      stride_time: 2
      stride_chan: 2
      dropout: 0.1
    cycle_fusion_dim: 128
    lstm_hidden: 128
    lstm_layers: 1
    lstm_dropout: 0.0
    head_hidden: 128
    head_dropout: 0.2
    use_xy: true
    xy_n_freqs: 6
    xy_enc_dim: 64
    use_film: true
    pool: "mean"
    aux_wafer_mean: true
    aux_wafer_loss_weight: 0.3

training:
  epochs: 120
  batch_size: 4
  lr: 5.0e-4
  weight_decay: 1.0e-4
  scheduler: "cosine"
  early_stop_patience: 0
  loss: "mse"
  num_workers: 0
  amp: false
  mixup:
    enabled: true
    alpha: 0.2
    prob: 1.0
  ema:
    enabled: true
    decay: 0.999
