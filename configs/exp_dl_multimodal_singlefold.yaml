# Option C — single-fold long-run to gauge DL capacity vs XGBoost baseline.
# 40 epochs × 1 fold × 2 targets (convergence observed ~ep 25 in pilot run).
# If RMSE saturates close to baseline → escalate to full 5-fold.

experiment:
  title: "dl multimodal singlefold"
  seed: 42

data:
  cache_version: "v1"
  split_file: "splits/kfold5_wafer.npz"
  spatial_features: ["X", "Y"]
  targets: ["oxide_etch", "si_etch"]   # oxide first — primary research target
  modality: "multimodal"
  t_o: 128
  t_p: 30

model:
  name: "cycle_aware_bilstm"
  params:
    oes_encoder:
      in_time: 128
      in_channels: 3648
      out_dim: 128
      base_channels: 16
      n_blocks: 4
      kernel_time: 3
      kernel_chan: 9
      stride_time: 2
      stride_chan: 4
      dropout: 0.1
    proc_encoder:
      in_time: 30
      in_channels: 31
      out_dim: 64
      base_channels: 16
      n_blocks: 3
      kernel_time: 3
      kernel_chan: 3
      stride_time: 2
      stride_chan: 2
      dropout: 0.1
    cycle_fusion_dim: 128
    lstm_hidden: 128
    lstm_layers: 1
    lstm_dropout: 0.0
    head_hidden: 128
    head_dropout: 0.2
    use_xy: true
    # Point-wise representation enrichment (added 2026-05-01):
    #   xy_n_freqs > 0  → Fourier-encode (X, Y) before head
    #   use_film        → FiLM-modulate wafer_repr per point
    # This addresses the within-wafer variance bottleneck for si_etch
    # (DL fold-0 RMSE 1.91 vs XGB 0.27 — 89 points all sharing the same
    # wafer_repr left only raw 2D xy to differentiate them).
    xy_n_freqs: 6
    xy_enc_dim: 64
    use_film: true

training:
  epochs: 40
  batch_size: 4
  lr: 1.5e-3
  weight_decay: 1.0e-4
  scheduler: "cosine"
  early_stop_patience: 8
  loss: "mse"
  num_workers: 0
  amp: false
