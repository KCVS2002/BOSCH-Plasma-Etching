# Phase-3 OES-only ablation — single-fold modality diagnostic.
# Architecture: FiLM + Fourier xy + mean pool (matches v1 multimodal,
# the current best). Process modality removed. Measures how much oxide
# signal lives in OES alone.
#   If OES-only ≈ multimodal v1 → process channels are uninformative.
#   If OES-only ≪ multimodal v1 → process is the dominant oxide signal.
# (attention pool was tried in oxide_v2 and made oxide WORSE — rolled back.)

experiment:
  title: "dl oes only singlefold"
  seed: 42

data:
  cache_version: "v1"
  split_file: "splits/kfold5_wafer.npz"
  spatial_features: ["X", "Y"]
  targets: ["oxide_etch"]   # primary research target; si_etch is saturated and skipped for speed
  modality: "oes"          # one of: oes, proc, multimodal
  t_o: 128
  t_p: 30

model:
  name: "cycle_aware_bilstm"
  params:
    oes_encoder:
      in_time: 128
      in_channels: 3648
      out_dim: 128
      base_channels: 16
      n_blocks: 4
      kernel_time: 3
      kernel_chan: 9       # wider receptive field along wavelength
      stride_time: 2
      stride_chan: 4       # 3648 → 912 → 228 → 57 → 14 wavelengths after 4 blocks
      dropout: 0.1
    proc_encoder: null
    cycle_fusion_dim: 128
    lstm_hidden: 128
    lstm_layers: 1
    lstm_dropout: 0.0
    head_hidden: 128
    head_dropout: 0.2
    use_xy: true
    xy_n_freqs: 6
    xy_enc_dim: 64
    use_film: true
    pool: "mean"

training:
  epochs: 40
  batch_size: 4
  lr: 1.5e-3
  weight_decay: 1.0e-4
  scheduler: "cosine"
  early_stop_patience: 8
  loss: "mse"
  num_workers: 0
  amp: false
