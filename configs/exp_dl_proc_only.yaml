# Phase-3 Process-only ablation — single-fold modality diagnostic.
# Same architecture (FiLM + Fourier + attention pool) as oxide_v2, but
# OES modality removed. Measures how much oxide signal lives in process
# parameters alone. If Proc-only is competitive on oxide, process
# parameters carry the dominant signal — and we should consider expanding
# the channel set (current intersection: 31 / 44 channels).

experiment:
  title: "dl proc only singlefold"
  seed: 42

data:
  cache_version: "v1"
  split_file: "splits/kfold5_wafer.npz"
  spatial_features: ["X", "Y"]
  targets: ["si_etch", "oxide_etch"]
  modality: "proc"
  t_o: 128
  t_p: 30

model:
  name: "cycle_aware_bilstm"
  params:
    oes_encoder: null
    proc_encoder:
      in_time: 30
      in_channels: 31
      out_dim: 64
      base_channels: 16
      n_blocks: 3
      kernel_time: 3
      kernel_chan: 3
      stride_time: 2
      stride_chan: 2
      dropout: 0.1
    cycle_fusion_dim: 64     # smaller — only one branch in
    lstm_hidden: 128
    lstm_layers: 1
    lstm_dropout: 0.0
    head_hidden: 128
    head_dropout: 0.3
    use_xy: true
    xy_n_freqs: 6
    xy_enc_dim: 64
    use_film: true
    pool: "attention"
    attn_hidden: 64

training:
  epochs: 40
  batch_size: 4
  lr: 1.5e-3
  weight_decay: 1.0e-4
  scheduler: "cosine"
  early_stop_patience: 8
  loss: "mse"
  num_workers: 0
  amp: false
