# Phase-3 Oxide v2 — attention pooling + stronger head dropout.
# Builds on exp_dl_multimodal_singlefold.yaml (FiLM + Fourier xy).
# Goal: push oxide R^2 above 0.73 (current FiLM single-fold result).
# si_etch likely stays similar (saturated near spatial baseline) — sanity only.
#
# Key change: cycle aggregation switches from uniform mean to learned
# softmax attention over the 100 BiLSTM outputs. Hypothesis — oxide etch
# is dominated by specific cycle phases (passivation breakthrough +
# stable etch window) rather than the global average, so attention
# should help more for oxide than for si.

experiment:
  title: "dl oxide v2 attn singlefold"
  seed: 42

data:
  cache_version: "v1"
  split_file: "splits/kfold5_wafer.npz"
  spatial_features: ["X", "Y"]
  targets: ["oxide_etch"]   # primary research target; si_etch is saturated and skipped for speed
  modality: "multimodal"
  t_o: 128
  t_p: 30

model:
  name: "cycle_aware_bilstm"
  params:
    oes_encoder:
      in_time: 128
      in_channels: 3648
      out_dim: 128
      base_channels: 16
      n_blocks: 4
      kernel_time: 3
      kernel_chan: 9
      stride_time: 2
      stride_chan: 4
      dropout: 0.1
    proc_encoder:
      in_time: 30
      in_channels: 31
      out_dim: 64
      base_channels: 16
      n_blocks: 3
      kernel_time: 3
      kernel_chan: 3
      stride_time: 2
      stride_chan: 2
      dropout: 0.1
    cycle_fusion_dim: 128
    lstm_hidden: 128
    lstm_layers: 1
    lstm_dropout: 0.0
    head_hidden: 128
    head_dropout: 0.3        # ↑ from 0.2 — extra regularisation for noisy oxide signal
    use_xy: true
    xy_n_freqs: 6
    xy_enc_dim: 64
    use_film: true
    pool: "attention"        # ★ new: learned weighted sum over 100 cycles
    attn_hidden: 64

training:
  epochs: 40
  batch_size: 4
  lr: 1.5e-3
  weight_decay: 1.0e-4
  scheduler: "cosine"
  early_stop_patience: 8
  loss: "mse"
  num_workers: 0
  amp: false
