# XGB Feature Injection variant of the multimodal best model.
# Base: exp_dl_multimodal_singlefold.yaml (FiLM + Fourier xy + mean pool).
# New:  15 wafer-level XGB process-temporal features are projected (32d) and
#       concat'd to the regression head AFTER FiLM modulation. FiLM remains
#       unchanged from the baseline (wafer_dim, zero-init both preserved).
#
# Hypothesis: the BiLSTM with mean pool computes a uniform cycle average,
# which DESTROYS directional information (slope, drift). Process channels'
# explicit slope/drift summaries fill this gap. Late features are kept where
# end-state matters (heater drift = SHAP #1 for oxide).
#
# Feature selection criteria (중요도 + 적절성):
#   1. Process-only (no OES — DL already sees raw 3648-ch OES)
#   2. No X, Y  (already in FiLM+Fourier)
#   3. Mix of late/slope/drift — slope/drift are uniquely NON-redundant
#      with mean pool (which averages out directional signals)
#   4. Physics-first channel order: thermal > RF > DC bias > pressure > gas
#   5. One stat per channel, but stat type varies across channels (interleave)
#
# To regenerate this list:
#   python src/features/xgb_inject.py --cache cache/v1 --top-k 15 \
#       --interleave --stat-priority late slope drift --max-stats 1

experiment:
  title: "dl multimodal xgbfeat singlefold"
  seed: 42
  limit_folds: 1    # single-fold only. override with --limit-folds 5 for full CV.

data:
  cache_version: "v1"
  split_file: "splits/kfold5_wafer.npz"
  spatial_features: ["X", "Y"]
  targets: ["oxide_etch", "si_etch"]
  modality: "multimodal"
  t_o: 128
  t_p: 30
  xgb_feat_names:
    # Thermal — late (final state) + slope/drift (directional)
    - proc_Heater1Temp_late
    - proc_Heater2Temp_slope   # SHAP 1위 채널, slope로 drift 방향
    - proc_Heater3Temp_drift
    - proc_Heater4Temp_late
    # Platen RF (etch power) — diverse stats
    - proc_PlatenRFLoadPower_slope
    - proc_PlatenRFPeakToPeak_drift
    - proc_PlatenRFReflectedPower_late
    # Source RF (ICP plasma density)
    - proc_SourceRFLoadPower_slope
    - proc_SourceRF2LoadPower_drift
    # Ion energy
    - proc_PlatenDcBias_late
    # Chamber pressure
    - proc_Pressure_slope
    - proc_ForeLinePressure_drift
    # Gas flow (SF6=Gas1, C4F8=Gas2 ratio drift)
    - proc_Gas1Flow_late
    - proc_Gas2Flow_slope
    - proc_Gas3Flow_drift

model:
  name: "cycle_aware_bilstm"
  params:
    oes_encoder:
      in_time: 128
      in_channels: 3648
      out_dim: 128
      base_channels: 16
      n_blocks: 4
      kernel_time: 3
      kernel_chan: 9
      stride_time: 2
      stride_chan: 4
      dropout: 0.1
    proc_encoder:
      in_time: 30
      in_channels: 31
      out_dim: 64
      base_channels: 16
      n_blocks: 3
      kernel_time: 3
      kernel_chan: 3
      stride_time: 2
      stride_chan: 2
      dropout: 0.1
    cycle_fusion_dim: 128
    lstm_hidden: 128
    lstm_layers: 1
    lstm_dropout: 0.0
    head_hidden: 128
    head_dropout: 0.2
    use_xy: true
    xy_n_freqs: 6
    xy_enc_dim: 64
    use_film: true
    pool: "mean"
    # XGB feature injection
    xgb_feat_dim: 15    # must equal len(data.xgb_feat_names)
    xgb_proj_dim: 32    # projected dim: wafer_repr becomes 256+32=288 before FiLM

training:
  epochs: 40
  batch_size: 4
  lr: 1.5e-3
  weight_decay: 1.0e-4
  scheduler: "cosine"
  early_stop_patience: 12   # 8 → 12: zero-init xgb_proj takes longer to start contributing
  loss: "mse"
  num_workers: 0
  amp: false
