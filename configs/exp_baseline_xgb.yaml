# Phase-2 baseline: XGBoost on per-cycle statistical OES + Process features.
# This is the comparison ground truth that Phase-3 DL must beat.

experiment:
  title: "baseline xgb"            # → outputs/experiments/<ts>_baseline-xgb/
  seed: 42

data:
  cache_version: "v1"
  split_file: "splits/kfold5_wafer.npz"
  feature_set: "baseline_xgb_v1"   # n_oes_bands=10, 8 stats per channel
  n_oes_bands: 10
  spatial_features: ["X", "Y"]
  targets: ["si_etch", "oxide_etch"]

model:
  name: "xgboost_regressor"
  params:
    n_estimators: 800
    max_depth: 6
    learning_rate: 0.05
    subsample: 0.8
    colsample_bytree: 0.8
    min_child_weight: 3
    reg_lambda: 1.0
    tree_method: "hist"
    n_jobs: -1
    random_state: 42
    verbosity: 0
